name: MindWeaver Go offline CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-latest
    env:
      CGO_ENABLED: "0"
      GOARCH: amd64
      GOENV: "off"
      GOFLAGS: -mod=vendor -trimpath -buildvcs=false
      GOOS: windows
      GOPROXY: "off"
      GOSUMDB: "off"
      GOTOOLCHAIN: local
      GOVCS: "*:off"
      GOWORK: "off"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: 1.27.0
          check-latest: false
          cache: false
      - name: Empty-cache vendored CI
        shell: pwsh
        run: ./scripts/ci.ps1 -Go (Get-Command go).Source
      - name: Tracked-only standalone CI
        shell: pwsh
        run: ./scripts/verify-standalone.ps1 -Go (Get-Command go).Source
