name: MindWeaver Go CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  windows-amd64:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: v2
    env:
      CGO_ENABLED: "0"
      GO111MODULE: "on"
      GOARCH: amd64
      GOAMD64: v1
      GOENV: "off"
      GOEXPERIMENT: ""
      GOFIPS140: "off"
      GOFLAGS: -mod=readonly -trimpath -buildvcs=false
      GOOS: windows
      GOTOOLCHAIN: local
      GOTELEMETRY: "off"
      GOWORK: "off"
      MW_CI_REPOSITORY_ROOT: ${{ github.workspace }}
    steps:
      # Actions and Go modules are fetched during the build. Runtime product
      # traffic remains loopback-only; build-time dependency resolution is a
      # separate supply-chain boundary verified by go.sum.
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Set up frozen Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: '1.27.0'
          check-latest: false
          cache: true
          cache-dependency-path: v2/go.sum
      - name: Download and verify modules
        shell: pwsh
        run: |
          go mod download
          go mod verify
      - name: Go module CI
        shell: pwsh
        run: ./scripts/ci.ps1 -Go (Get-Command go).Source
      - name: Tracked-only standalone CI
        shell: pwsh
        run: ./scripts/verify-standalone.ps1 -Go (Get-Command go).Source
